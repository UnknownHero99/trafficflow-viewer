# Server deployment: runs the image that GitHub Actions publishes to ghcr.io and
# keeps it up to date. To build from source instead, use docker-compose.dev.yml.
services:
  trafficflow:
    image: ${TFV_IMAGE:-ghcr.io/unknownhero99/trafficflow-viewer:latest}
    container_name: trafficflow
    restart: unless-stopped
    ports:
      - "2055:2055/udp"   # MikroTik sends flows here
      - "${TFV_WEB_PORT:-8321}:8080"   # web UI (8080 inside the container)
    volumes:
      - ./data:/data      # database, GeoIP files and optional config.toml
    environment:
      - TZ=${TZ:-Europe/Ljubljana}
      - TFV_AGENT_TOKEN=${TFV_AGENT_TOKEN:-}
      - TFV_NO_INTERNET_NETWORKS=${TFV_NO_INTERNET_NETWORKS:-}
    labels:
      # opt in to automatic updates (Watchtower below ignores every other container)
      - com.centurylinklabs.watchtower.enable=true

  # Optional: shows which program or container on THIS server caused its traffic.
  # Turn on with COMPOSE_PROFILES=agent and TFV_AGENT_TOKEN=<random string> in .env.
  # It needs broad access to the host (host network and processes, the NAT table,
  # the Docker socket), so only run it on servers you control.
  agent:
    image: ${TFV_IMAGE:-ghcr.io/unknownhero99/trafficflow-viewer:latest}
    container_name: trafficflow-agent
    profiles: [agent]
    restart: unless-stopped
    command: ["python", "-m", "tfv.agent"]
    healthcheck:
      disable: true   # the image's check probes the web UI, which the agent doesn't serve
    network_mode: host
    pid: host
    cap_add: [NET_ADMIN, SYS_PTRACE, NET_RAW]
    security_opt: ["apparmor:unconfined"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TFV_RUN_AS_ROOT=1
      - TFV_URL=${TFV_AGENT_URL:-http://127.0.0.1:${TFV_WEB_PORT:-8321}}
      - TFV_AGENT_TOKEN=${TFV_AGENT_TOKEN:-}
      - TZ=${TZ:-Europe/Ljubljana}
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Checks ghcr.io for a new image every UPDATE_INTERVAL seconds and restarts the
  # app with it. Maintained fork of containrrr/watchtower (which fails on Docker 29+).
  watchtower:
    image: nickfedor/watchtower:1.23.1
    container_name: trafficflow-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only if the image is private: run `docker login ghcr.io` on the server, then uncomment.
      # - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=${UPDATE_INTERVAL:-300}
      - WATCHTOWER_CLEANUP=true
      - TZ=${TZ:-Europe/Ljubljana}
